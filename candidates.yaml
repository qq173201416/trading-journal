# 候选建仓观察名单 — 人工维护,routine 不会修改这个文件本身(只读)。
#
# 用途:跟踪"从没买过、正在等右侧确认信号才考虑建仓"的股票——和 watchlist.yaml
# (那个是"曾经持有、清仓后等回调重新买回")是两个完全不同的场景,不共用同一份状态,
# 因为这里没有 avg_cost/exit_price 这些历史持仓数据可以参照。
#
# 判据是纯日线的机械规则(趋势过滤器 + 回调分层 + 右侧确认,和止盈止损 routine 的
# 加仓判定同一套逻辑,只是基准换成"加入名单以来的高点"而不是"持仓成本/清仓价")。
# 不包含周线级别的趋势反转/RSI背离这类更难机械化的判断——那部分请继续在对话里让我
# 单独分析,不适合塞进这个只做客观监测的 routine。
#
# 格式:
# candidates:
#   - ticker: GLW
#     added_at: "2026-09-01"
#     note: "深度回调后震荡筑底,周线均线未转向、RSI无背离,还没到确认止跌——先用日线
#            机械判据挂着观察,等右侧确认信号,不代表现在建议买入"
#
# note 字段纯文本记录,routine 不解析、不使用,只是给人工看的备注。

candidates:
  - ticker: GLW
    added_at: "2026-09-01"
    note: "深度回调后震荡筑底,周线均线未转向、RSI无背离,还没到确认止跌——先用日线机械判据挂着观察,等右侧确认信号,不代表现在建议买入"
