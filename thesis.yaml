# 持仓论点 — 买入理由(buy_reason)与论点失效条件(invalidation)
# 人工维护,routine 只读。invalidation 只写可客观核对的事实条件,不含价格预测。
# TSM / SKHY 为用户原文;其余为草稿(合并两版起草稿),待用户复核。
# 持仓清单与 claude/takeprofit-monitor-state 的 positions.yaml 保持一致。

TSM:
  buy_reason: "AI 先进制程代工垄断,2nm 量产领先"
  invalidation:
    - "3nm/2nm 良率或客户份额出现失守信号"
    - "台海或出口管制出现实质性不利变化"
    - "季度毛利率连续两季下滑超 2pp"

SKHY:
  buy_reason: "HBM 龙头,存储周期底部建仓"
  invalidation:
    - "HBM 份额被竞争对手明显蚕食"
    - "DRAM 价格连续两个月下跌"

ORCL:
  buy_reason: "AI 云基础设施(OCI)订单积压大,基本面在位,判断处于筑底"
  invalidation:
    - "RPO(剩余履约义务)环比下降,或主要 AI 客户合同被披露取消、缩减或延期"
    - "OCI 收入同比增速连续两季下降"
    - "信用评级被下调,或公司债利差较上季末明显走阔"

NVDA:
  buy_reason: "AI 加速计算龙头,CUDA 生态主导,数据中心需求持续"
  invalidation:
    - "数据中心收入环比下降,或下季收入指引低于市场共识"
    - "季度毛利率连续两季下滑超 2pp"
    - "前四大云厂商中至少两家公告下调年度资本开支指引"
    - "对华出口管制出现新的实质性收紧"

NOW:
  buy_reason: "企业工作流平台,AI Agent 产品推动订阅收入稳定增长"
  invalidation:
    - "订阅收入同比增速连续两季放缓"
    - "cRPO 同比增速连续两季下降,或披露续约率下降"
    - "下调全年订阅收入或营业利润率指引"

MSFT:
  buy_reason: "Azure + Copilot 双轮驱动 AI 变现,企业级现金流稳健"
  invalidation:
    - "Azure 恒定汇率同比增速连续两季放缓,且低于公司指引"
    - "资本开支指引上调,但同期 Azure 增速下降"
    - "下调业绩指引,或与 OpenAI 的合作条款出现公告的不利变化"

INFQ:
  buy_reason: "Infleqtion 中性原子量子计算/传感,早期主题性仓位"
  invalidation:
    - "现金及等价物不足覆盖未来 4 个季度经营现金流出,且未完成新融资"
    - "公布的量子比特规模/逻辑比特/保真度路线图里程碑延期超过两个季度"
    - "关键政府或商业合同被取消或大幅缩减"

ACMR:
  buy_reason: "半导体清洗/电镀设备,受益国产替代与先进封装需求"
  invalidation:
    - "新增出口管制或实体清单直接限制公司销售或零部件供应"
    - "季度营收或订单环比下滑,或下调全年收入指引"
    - "季度毛利率连续两季下滑"

BE:
  buy_reason: "固体氧化物燃料电池为数据中心现场发电,AI 电力瓶颈受益者"
  invalidation:
    - "数据中心/超大规模客户订单被取消,或交付公告推迟"
    - "季度毛利率连续两季下滑超 2pp"
    - "增发股票或发行可转债导致股本稀释超 5%"

QCOM:
  buy_reason: "手机 SoC 现金牛,向 AI PC/汽车/数据中心扩张"
  invalidation:
    - "苹果调制解调器订单流失速度快于公司已披露指引"
    - "汽车业务收入同比增速连续两季下降,或非手机业务指引被下调"
    - "下调全年业绩指引"

VST:
  buy_reason: "核电与燃气发电资产,受益 AI 数据中心长期购电合约"
  invalidation:
    - "数据中心长期购电合约(PPA)被取消或条款公告恶化"
    - "监管否决电厂直连供电安排或关键核电相关交易"
    - "管理层下调年度调整后 EBITDA 指引"

GRAB:
  buy_reason: "东南亚出行 + 外卖 + 金融服务超级应用,基本面稳定,长期横盘中潜伏"
  invalidation:
    - "调整后 EBITDA 同比下滑或转负"
    - "按需 GMV 同比增速连续两季放缓"
    - "金融服务贷款不良率连续两季上升,或下调全年指引"

GOOG:
  buy_reason: "搜索现金牛 + Google Cloud + Gemini 全栈 AI,估值相对合理"
  invalidation:
    - "Google 搜索收入同比增速连续两季放缓"
    - "Google Cloud 收入同比增速连续两季下降"
    - "反垄断判决强制剥离 Chrome/Android 或禁止默认搜索付费协议"

NKE:
  buy_reason: "品牌龙头,困境反转布局,小仓位"
  invalidation:
    - "营收连续两季同比负增长,且毛利率继续同比下滑"
    - "库存同比增速高于收入同比增速连续两季"
    - "下调全年指引,或 CEO/CFO 再次变动"

WULF:
  buy_reason: "TeraWulf:比特币矿场转型 AI/HPC 算力托管,长期租约锁定收入"
  invalidation:
    - "HPC/AI 托管租约被取消、缩减或交付期公告推迟"
    - "托管客户或租约担保方出现违约、终止担保"
    - "增发股票或发行可转债导致股本稀释超 10%"

CCJ:
  buy_reason: "Cameco:铀矿龙头 + Westinghouse 核电服务,受益核电复兴与长期合约"
  invalidation:
    - "下调年度铀产量或交付指引"
    - "主要矿山(Cigar Lake / McArthur River)出现计划外停产超过一个季度"
    - "Westinghouse 板块下调调整后 EBITDA 指引"
