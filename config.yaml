# 止盈止损监控 + 机会扫描 — 配置文件
#
# 设计原则(优先于下面任何具体数值):本 routine 的唯一职责是依据这里定义的客观条件输出
# 分析与建议;所有买入/卖出/加仓/不操作的最终决定都由用户人工确认。routine 不执行任何
# 交易,输出永远是"建议 + 依据",不是"指令"。
#
# 从 v14 SOP 吸收了止损分支、顺势回调加仓建议、Watchlist 重新建仓建议——但只吸收交易
# 逻辑本身,不引入 schema_version/config_version 双轨版本管理、reason_code 编号体系、
# 进程重启检测、原子写入、per-ticker即时提交这些工程机制,原因见
# docs/takeprofit-routine-spec-v14.md 顶部的取舍说明:那一整层是给"长期运行进程+多人
# 维护+下游有统计系统"设计的,和 Claude Routine "每次触发都是全新容器"的执行模型不匹配,
# 只会拉长 Prompt、增加执行时漏掉某条规则的概率,对单人个人项目没有对应的收益。

profit_targets:
  tier_1: { threshold: 20, reduce_pct: 25 }
  tier_2: { threshold: 35, reduce_pct: 40 }
  tier_3: { threshold: 50, reduce_pct: 60 }

# 止损:与止盈同级、方向相反,机械化无例外,不受财报护栏或大盘状态影响。
# trend_break_ma: 跌破这条均线且处于浮亏,至少视为命中 tier_1(即使百分比还没到 -15%)。
stop_loss_targets:
  tier_1: -15
  tier_2: -25
  trend_break_ma: ma_50d

# Hourly RSI 紧急辅助强升(仅浮盈>0时生效,强制升级为 Tier 3)。
hourly_rsi:
  overbought_threshold: 80
  lookback_bars: 15

# 财报护栏:止盈只加展示标签,加仓/重新建仓建议 3 天内直接跳过评估;止损永远无视财报。
earnings_guard:
  days_before: 3

# 顺势回调加仓建议(持仓中)与 Watchlist 重新建仓建议(已清仓)共用下面这套判据。
trend_filter:
  require_ma20_above_ma50: true
  ma20_slope_lookback_days: 5
  never_chase_max_extension_pct: 8

pullback_targets:
  tier_1: { pct_floor: 5,  atr_multiple: 1.0 }
  tier_2: { pct_floor: 10, atr_multiple: 2.0 }
  tier_3: { pct_floor: 15, atr_multiple: 3.0 }

right_side_confirmation:
  conditions: ["higher_low", "close_above_ma5", "volume_expansion"]
  bull_market_required: 1
  bear_market_required: 2

risk_control:
  max_dca_executions: 3
  max_total_dca_pct: 30
  dca_cooldown_trading_days: 5
  remaining_position_dca_caps:
    - { max_remaining_pct: 100, max_additional_dca: 3 }
    - { max_remaining_pct: 50,  max_additional_dca: 1 }
    - { max_remaining_pct: 25,  max_additional_dca: 0 }

market_risk_mode:
  vix_hard_stop: 25
  check_qqq_50ma: true
  check_soxx_50ma: true

# 同一天内"止盈/止损提醒"与"加仓建议"这两个方向相反的消息互斥,防止早发REDUCE晚发ADD
# 建议自相矛盾。止损分支永远豁免此锁;同类别Tier升级(比如止盈Tier1当天升级Tier2)也豁免。
action_lock:
  block_opposing_action_same_day: true
