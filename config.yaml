# 止盈+止损监控 — 配置文件
#
# 从 v14 SOP 里只吸收了止损分支;顺势加仓/Watchlist重新建仓不采用(继续是 Portfolio
# Monitor,不是 Portfolio Manager);也不引入 v14 里 schema_version/config_version 双轨
# 版本管理、reason_code 编号体系、原子写入、per-ticker即时提交这些工程机制——这些是给
# "长期运行进程+多人维护+下游有统计系统"设计的,和 Claude Routine "每次触发都是全新容器,
# 每次都要重新读一遍 prompt"的执行模型不匹配,详见 docs/takeprofit-routine-spec-v14.md
# 顶部的取舍说明。

profit_targets:
  tier_1: { threshold: 20, reduce_pct: 25 }
  tier_2: { threshold: 35, reduce_pct: 40 }
  tier_3: { threshold: 50, reduce_pct: 60 }

# 止损:与止盈同级、方向相反,机械化无例外,不受财报护栏或大盘状态影响。
# trend_break_ma: 跌破这条均线且处于浮亏,至少视为命中 tier_1(即使百分比还没到 -15%)。
stop_loss_targets:
  tier_1: -15
  tier_2: -25
  trend_break_ma: ma_50d

# Hourly RSI 紧急辅助强升(仅浮盈>0时生效,强制升级为 Tier 3)。
hourly_rsi:
  overbought_threshold: 80
  lookback_bars: 15

# 财报护栏:只影响止盈的展示标签,不影响止损(止损永远无视财报,风险控制优先于一切)。
earnings_guard:
  days_before: 3
